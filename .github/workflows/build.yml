name: Build TRADE EXPERT EA APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install packages
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Capacitor config
        run: |
          ls capacitor.config.* >/dev/null 2>&1 || cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from "@capacitor/cli";

          const config: CapacitorConfig = {
            appId: "com.tradeexpert.app",
            appName: "TRADE EXPERT EA",
            webDir: "dist",
            server: { url: "https://tradeexpertea.com/ea-app", cleartext: false },
          };
          export default config;
          EOF
      - name: Build web app
        run: npm run build
      - name: Add Android project
        run: '[ -d android ] || npx cap add android'
      - name: Install floating overlay
        run: |
          PKG=$(grep -ohP "appId[\"']?\s*:\s*[\"']\K[^\"']+" capacitor.config.* | head -1)
          [ -z "$PKG" ] && { echo "appId not found"; exit 1; }
          DIR="android/app/src/main/java/$(echo $PKG | tr . /)"
          mkdir -p "$DIR" android/app/src/main/res/drawable android/app/src/main/assets
          cat > "$DIR/FloatingBubblePlugin.java" <<'EOF'
          package __PKG__;

          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.Settings;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "FloatingBubble")
          public class FloatingBubblePlugin extends Plugin {

              @Override
              public void load() {
                  OverlayService.listener = new OverlayService.Listener() {
                      @Override public void onAction(String id, String action) {
                          JSObject o = new JSObject();
                          o.put("id", id);
                          o.put("action", action);
                          notifyListeners("overlayAction", o);
                      }
                  };
              }

              @PluginMethod
              public void hasPermission(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("granted", Settings.canDrawOverlays(getContext()));
                  call.resolve(r);
              }

              @PluginMethod
              public void requestPermission(PluginCall call) {
                  Context c = getContext();
                  if (!Settings.canDrawOverlays(c)) {
                      Intent i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + c.getPackageName()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      c.startActivity(i);
                  }
                  call.resolve();
              }

              /** Add / update one EA (bot) and open its panel. Call once per EA you start. */
              @PluginMethod
              public void show(PluginCall call) {
                  Context c = getContext();
                  if (!Settings.canDrawOverlays(c)) { call.reject("overlay permission not granted"); return; }
                  Intent i = new Intent(c, OverlayService.class);
                  i.putExtra("op", "show");
                  i.putExtra("id", call.getString("id", "default"));
                  i.putExtra("name", call.getString("name", ""));
                  i.putExtra("image", call.getString("image", ""));
                  i.putExtra("title", call.getString("title", ""));
                  i.putExtra("online", call.getBoolean("online", true));
                  if (call.hasOption("size")) i.putExtra("size", call.getFloat("size", 90f));
                  ContextCompat.startForegroundService(c, i);
                  call.resolve();
              }

              @PluginMethod
              public void setSize(PluginCall call) {
                  Context c = getContext();
                  Intent i = new Intent(c, OverlayService.class);
                  i.putExtra("size", call.getFloat("size", 90f));
                  ContextCompat.startForegroundService(c, i);
                  call.resolve();
              }

              @PluginMethod
              public void setStatus(PluginCall call) {
                  OverlayService.setStatus(call.getString("id", "default"), call.getBoolean("online", true));
                  call.resolve();
              }

              @PluginMethod
              public void log(PluginCall call) {
                  OverlayService.log(call.getString("id", "default"), call.getString("line", ""));
                  call.resolve();
              }

              /** hide({id}) removes one EA; hide() removes everything. */
              @PluginMethod
              public void hide(PluginCall call) {
                  if (call.hasOption("id")) OverlayService.hideBot(call.getString("id"));
                  else getContext().stopService(new Intent(getContext(), OverlayService.class));
                  call.resolve();
              }
          }
          EOF
          cat > "$DIR/OverlayService.java" <<'EOF'
          package __PKG__;

          import android.app.*;
          import android.content.*;
          import android.content.pm.ServiceInfo;
          import android.graphics.*;
          import android.graphics.drawable.GradientDrawable;
          import android.os.*;
          import android.util.DisplayMetrics;
          import android.view.*;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.*;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import org.json.JSONObject;

          public class OverlayService extends Service {
              public interface Listener { void onAction(String id, String action); }
              public static Listener listener;
              private static OverlayService instance;

              private static final String CH = "tradeexpert_overlay", LABEL = "Powered by TradeExpert";
              private static final float MIN_DP = 56f, MAX_DP = 220f;

              private static class Bot {
                  String id, name = "", image = ""; boolean online = true;
                  LinearLayout root; FrameLayout bubble; ImageView avatar; TextView label;
                  WindowManager.LayoutParams lp;
              }

              private final Handler main = new Handler(Looper.getMainLooper());
              private final LinkedHashMap<String, Bot> bots = new LinkedHashMap<>();
              private WindowManager wm;
              private SharedPreferences sp;
              private ScaleGestureDetector scaler;
              private boolean expanded = false;
              private String openId = null;
              private float sizeDp = 90f;

              private WebView web; private WindowManager.LayoutParams plp;
              private float panelFrac = 0.86f;
              private boolean ready = false;
              private final ArrayList<String> pending = new ArrayList<>();

              // ------------------------------------------------------------ static API
              private static String q(String s) { return JSONObject.quote(s == null ? "" : s); }
              public static void push(String js) { OverlayService s = instance; if (s != null) s.runJs(js); }
              public static void log(String id, String line) { push("window.cotex&&cotex.log(" + q(id) + "," + q(line) + ")"); }
              public static void setStatus(final String id, final boolean on) {
                  final OverlayService s = instance; if (s == null) return;
                  s.main.post(new Runnable() { public void run() {
                      Bot b = s.bots.get(id); if (b != null) b.online = on;
                      s.runJs("window.cotex&&cotex.setStatus(" + q(id) + "," + on + ")");
                  }});
              }
              public static void hideBot(final String id) {
                  final OverlayService s = instance; if (s == null) return;
                  s.main.post(new Runnable() { public void run() { s.removeBot(id); } });
              }

              // -------------------------------------------------------------- lifecycle
              @Override public IBinder onBind(Intent i) { return null; }
              @Override public void onCreate() { super.onCreate(); instance = this; }

              @Override
              public int onStartCommand(Intent i, int flags, int startId) {
                  startAsForeground();
                  ensureInit();
                  if (i == null) { if (bots.isEmpty()) stopSelf(); return START_NOT_STICKY; }
                  if (i.hasExtra("size")) {
                      sizeDp = clamp(i.getFloatExtra("size", sizeDp));
                      sp.edit().putFloat("size", sizeDp).apply();
                      for (Bot b : bots.values()) applyBubbleSize(b);
                  }
                  if ("show".equals(i.getStringExtra("op"))) {
                      showBot(i.getStringExtra("id"), i.getStringExtra("name"), i.getStringExtra("image"),
                              i.getBooleanExtra("online", true), i.getStringExtra("title"));
                  } else if (bots.isEmpty()) stopSelf();
                  return START_NOT_STICKY;
              }

              private void ensureInit() {
                  if (wm != null) return;
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  sp = getSharedPreferences("tradeexpert_overlay", MODE_PRIVATE);
                  sizeDp = sp.getFloat("size", 90f);
                  panelFrac = sp.getFloat("panel", 0.86f);
                  scaler = new ScaleGestureDetector(this, new ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      @Override public boolean onScale(ScaleGestureDetector d) {
                          if (expanded && web != null) {
                              panelFrac = Math.max(0.55f, Math.min(1.0f, panelFrac * d.getScaleFactor()));
                              sizePanel(false);
                              if (web.isAttachedToWindow()) wm.updateViewLayout(web, plp);
                          } else {
                              sizeDp = clamp(sizeDp * d.getScaleFactor());
                              for (Bot b : bots.values()) applyBubbleSize(b);
                          }
                          return true;
                      }
                      @Override public void onScaleEnd(ScaleGestureDetector d) {
                          sp.edit().putFloat("size", sizeDp).putFloat("panel", panelFrac).apply();
                      }
                  });
              }

              private void startAsForeground() {
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  Notification.Builder b;
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(new NotificationChannel(CH, "Floating overlay", NotificationManager.IMPORTANCE_LOW));
                      b = new Notification.Builder(this, CH);
                  } else b = new Notification.Builder(this);
                  Notification n = b.setContentTitle("TRADE EXPERT EA running").setContentText(LABEL)
                          .setSmallIcon(getApplicationInfo().icon).setOngoing(true).build();
                  if (Build.VERSION.SDK_INT >= 34) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  else startForeground(1, n);
              }

              // ------------------------------------------------------------------- bots
              private void showBot(String id, String name, String image, boolean online, String title) {
                  if (id == null || id.isEmpty()) id = "default";
                  Bot b = bots.get(id);
                  if (b == null) { b = new Bot(); b.id = id; bots.put(id, b); buildBubble(b); }
                  b.name = name == null ? "" : name;
                  b.online = online;
                  String img = image == null ? "" : image;
                  if (!img.equals(b.image) || b.avatar.getDrawable() == null) { b.image = img; loadImage(b); }
                  if (web == null) buildPanel();
                  openPanel(b, title);
              }

              private void removeBot(String id) {
                  Bot b = bots.remove(id);
                  if (b == null) return;
                  if (b.root.isAttachedToWindow()) wm.removeView(b.root);
                  runJs("window.cotex&&cotex.remove(" + q(id) + ")");
                  if (bots.isEmpty()) { stopSelf(); return; }
                  if (expanded && id.equals(openId)) collapse();
              }

              private void loadImage(final Bot b) {
                  int def = getResources().getIdentifier("bot_avatar", "drawable", getPackageName());
                  b.avatar.setImageResource(def);
                  if (b.image == null || !b.image.startsWith("http")) return;
                  final String url = b.image;
                  new Thread(new Runnable() { public void run() {
                      Bitmap bmp = null;
                      try {
                          HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                          c.setConnectTimeout(8000); c.setReadTimeout(8000);
                          InputStream in = c.getInputStream();
                          bmp = BitmapFactory.decodeStream(in);
                          in.close();
                      } catch (Exception ignored) {}
                      final Bitmap fb = bmp;
                      main.post(new Runnable() { public void run() {
                          if (fb != null && bots.get(b.id) == b && url.equals(b.image)) b.avatar.setImageBitmap(fb);
                      }});
                  }}).start();
              }

              // ------------------------------------------------------------------ panel
              private void buildPanel() {
                  web = new WebView(this);
                  web.setBackgroundColor(Color.TRANSPARENT);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setWebViewClient(new WebViewClient() {
                      @Override public void onPageFinished(WebView v, String url) {
                          ready = true;
                          for (String js : pending) v.evaluateJavascript(js, null);
                          pending.clear();
                      }
                  });

                  plp = new WindowManager.LayoutParams(-2, -2, overlayType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  plp.gravity = Gravity.TOP | Gravity.START;
                  plp.x = sp.getInt("px", -1);
                  plp.y = sp.getInt("py", getResources().getDisplayMetrics().heightPixels / 5);
                  sizePanel(plp.x < 0);

                  web.setOnTouchListener(new View.OnTouchListener() {
                      boolean dragging; float tx, ty; int sx, sy;
                      @Override public boolean onTouch(View v, MotionEvent e) {
                          scaler.onTouchEvent(e);
                          float unit = plp.width / 360f;
                          switch (e.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  dragging = e.getY() < 44 * unit && e.getX() < plp.width - 48 * unit;
                                  if (dragging) { sx = plp.x; sy = plp.y; tx = e.getRawX(); ty = e.getRawY(); }
                                  return dragging;
                              case MotionEvent.ACTION_MOVE:
                                  if (dragging && e.getPointerCount() == 1 && !scaler.isInProgress()) {
                                      plp.x = sx + (int) (e.getRawX() - tx);
                                      plp.y = sy + (int) (e.getRawY() - ty);
                                      wm.updateViewLayout(web, plp);
                                  }
                                  return dragging;
                              case MotionEvent.ACTION_UP:
                              case MotionEvent.ACTION_CANCEL:
                                  if (dragging) {
                                      dragging = false;
                                      sp.edit().putInt("px", plp.x).putInt("py", plp.y).apply();
                                      return true;
                                  }
                                  return false;
                          }
                          return false;
                      }
                  });
                  web.loadUrl("file:///android_asset/overlay.html");
              }

              private void sizePanel(boolean center) {
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  int w = Math.round(dm.widthPixels * panelFrac), h = Math.round(w * 400f / 360f);
                  if (h > dm.heightPixels * 0.9f) { h = Math.round(dm.heightPixels * 0.9f); w = Math.round(h * 360f / 400f); }
                  plp.width = w; plp.height = h;
                  if (center) plp.x = (dm.widthPixels - w) / 2;
                  plp.x = Math.max(0, Math.min(plp.x, dm.widthPixels - w));
                  plp.y = Math.max(0, Math.min(plp.y, dm.heightPixels - h));
              }

              private void openPanel(Bot b, String title) {
                  for (Bot x : bots.values()) if (x.root.isAttachedToWindow()) wm.removeView(x.root);
                  openId = b.id;
                  runJs("window.cotex&&cotex.open(" + q(b.id) + "," + q(b.name) + "," + q(b.image) + "," + b.online + "," + q(title) + ")");
                  sizePanel(false);
                  if (!web.isAttachedToWindow()) wm.addView(web, plp);
                  expanded = true;
              }

              private void collapse() {
                  if (web != null && web.isAttachedToWindow()) wm.removeView(web);
                  expanded = false;
                  for (Bot b : bots.values()) {
                      applyBubbleSize(b);
                      if (!b.root.isAttachedToWindow()) wm.addView(b.root, b.lp);
                  }
              }

              private class Bridge {
                  @JavascriptInterface public void collapse() { main.post(new Runnable() { public void run() { OverlayService.this.collapse(); } }); }
                  @JavascriptInterface public void action(final String id, final String a) {
                      main.post(new Runnable() { public void run() {
                          Bot b = bots.get(id);
                          if (b != null) { if ("start".equals(a)) b.online = true; if ("stop".equals(a)) b.online = false; }
                      }});
                      Listener l = listener; if (l != null) l.onAction(id, a);
                  }
              }

              private void runJs(final String js) {
                  main.post(new Runnable() { public void run() {
                      if (web == null) return;
                      if (ready) web.evaluateJavascript(js, null); else pending.add(js);
                  }});
              }

              // ----------------------------------------------------------------- bubble
              private void buildBubble(final Bot b) {
                  int idx = bots.size() - 1;
                  b.root = new LinearLayout(this);
                  b.root.setOrientation(LinearLayout.VERTICAL);
                  b.root.setGravity(Gravity.CENTER_HORIZONTAL);

                  b.bubble = new FrameLayout(this);
                  b.avatar = new ImageView(this);
                  b.avatar.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  b.avatar.setOutlineProvider(new ViewOutlineProvider() {
                      @Override public void getOutline(View v, Outline o) { o.setOval(0, 0, v.getWidth(), v.getHeight()); }
                  });
                  b.avatar.setClipToOutline(true);
                  b.bubble.addView(b.avatar, new FrameLayout.LayoutParams(-1, -1));

                  b.label = new TextView(this);
                  b.label.setText(LABEL);
                  b.label.setTextColor(0xFF6FA8FF);
                  b.label.setTypeface(Typeface.MONOSPACE);
                  b.label.setGravity(Gravity.CENTER);
                  b.label.setShadowLayer(8f, 0, 0, 0xFF000000);
                  b.root.addView(b.bubble);
                  b.root.addView(b.label, new LinearLayout.LayoutParams(-2, -2));

                  b.lp = new WindowManager.LayoutParams(-2, -2, overlayType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  b.lp.gravity = Gravity.TOP | Gravity.START;
                  b.lp.x = sp.getInt("bx_" + b.id, 40);
                  b.lp.y = sp.getInt("by_" + b.id, 300 + idx * dp(sizeDp + 34));

                  b.root.setOnTouchListener(new View.OnTouchListener() {
                      int sx, sy; float tx, ty; boolean moved, rebase;
                      @Override public boolean onTouch(View v, MotionEvent e) {
                          scaler.onTouchEvent(e);
                          if (scaler.isInProgress()) { moved = true; return true; }
                          switch (e.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  sx = b.lp.x; sy = b.lp.y; tx = e.getRawX(); ty = e.getRawY(); moved = false; rebase = false;
                                  return true;
                              case MotionEvent.ACTION_POINTER_UP:
                                  rebase = true; return true;
                              case MotionEvent.ACTION_MOVE:
                                  if (e.getPointerCount() != 1) return true;
                                  if (rebase) { sx = b.lp.x; sy = b.lp.y; tx = e.getRawX(); ty = e.getRawY(); rebase = false; }
                                  float dx = e.getRawX() - tx, dy = e.getRawY() - ty;
                                  if (Math.abs(dx) > 12 || Math.abs(dy) > 12) moved = true;
                                  if (moved) { b.lp.x = sx + (int) dx; b.lp.y = sy + (int) dy; wm.updateViewLayout(b.root, b.lp); }
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (!moved) openPanel(b, null);
                                  else sp.edit().putInt("bx_" + b.id, b.lp.x).putInt("by_" + b.id, b.lp.y).apply();
                                  return true;
                          }
                          return false;
                      }
                  });
                  applyBubbleSize(b);
              }

              private void applyBubbleSize(Bot b) {
                  int px = dp(sizeDp), ring = Math.max(dp(2), Math.round(px * 0.04f)), pad = Math.round(px * 0.07f);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setShape(GradientDrawable.OVAL);
                  bg.setColor(0xFF03070D);
                  bg.setStroke(ring, 0xFF2F7BE0);
                  b.bubble.setBackground(bg);
                  b.bubble.setPadding(pad, pad, pad, pad);
                  b.bubble.setLayoutParams(new LinearLayout.LayoutParams(px, px));
                  b.label.setTextSize(Math.max(7f, sizeDp / 10f));
                  if (b.root.isAttachedToWindow()) wm.updateViewLayout(b.root, b.lp);
              }

              // ---------------------------------------------------------------- helpers
              private int overlayType() {
                  return Build.VERSION.SDK_INT >= 26 ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          : WindowManager.LayoutParams.TYPE_PHONE;
              }
              private float clamp(float v) { return Math.max(MIN_DP, Math.min(MAX_DP, v)); }
              private int dp(float v) { return Math.round(v * getResources().getDisplayMetrics().density); }

              @Override
              public void onDestroy() {
                  try { if (web != null && web.isAttachedToWindow()) wm.removeView(web); } catch (Exception ignored) {}
                  for (Bot b : bots.values()) { try { if (b.root.isAttachedToWindow()) wm.removeView(b.root); } catch (Exception ignored) {} }
                  bots.clear();
                  if (web != null) web.destroy();
                  web = null; instance = null; ready = false; expanded = false;
                  super.onDestroy();
              }
          }
          EOF
          cat > "$DIR/MainActivity.java" <<'EOF'
          package __PKG__;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(FloatingBubblePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          sed -i "s/__PKG__/$PKG/g" "$DIR/FloatingBubblePlugin.java" "$DIR/OverlayService.java" "$DIR/MainActivity.java"
          cat > android/app/src/main/assets/overlay.html <<'EOF'
          <!doctype html>
          <html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <style>
          *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
          html,body{background:transparent;overflow:hidden;width:100%;height:100%;font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
          #wrap{position:absolute;left:0;top:0;width:360px;height:400px;transform-origin:0 0}
          .panel{position:absolute;left:0;top:0;width:360px;height:372px;border-radius:14px;border:1px solid #17304f;
            background:rgba(4,8,13,.96);box-shadow:0 0 0 1px #0a1522,inset 0 0 40px rgba(20,60,110,.22)}
          .c{position:absolute;width:13px;height:13px;border:2px solid #1d4372}
          .tl{top:8px;left:8px;border-right:0;border-bottom:0;border-radius:3px 0 0 0}
          .tr{top:8px;right:8px;border-left:0;border-bottom:0;border-radius:0 3px 0 0}
          .bl{bottom:8px;left:8px;border-right:0;border-top:0;border-radius:0 0 0 3px}
          .br{bottom:8px;right:8px;border-left:0;border-top:0;border-radius:0 0 3px 0}
          .hd{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 24px;border-bottom:1px solid #10233a}
          .dots{display:grid;grid-template-columns:repeat(3,5px);gap:4px}
          .dots i{width:5px;height:5px;border-radius:50%;background:#2b5f94}
          .ttl{color:#2b5f94;letter-spacing:3px;font-size:13px}
          .x{width:32px;height:32px;border-radius:50%;border:2px solid #1d4372;color:#2b5f94;display:flex;align-items:center;justify-content:center;font-size:15px;background:transparent}
          .banner{position:relative;margin:12px 14px 0;height:100px;border-radius:10px;border:1px solid #17304f;overflow:hidden;
            background:linear-gradient(135deg,#0a1a2e,#05090e)}
          .pill{position:absolute;top:9px;left:9px;display:flex;align-items:center;gap:6px;border:1px solid #1d4372;border-radius:16px;padding:3px 10px;
            font-size:10px;letter-spacing:2px;color:#2b5f94;background:rgba(3,7,12,.7)}
          .pill b{width:7px;height:7px;border-radius:50%;background:#2b5f94;display:block}
          .pill.on{color:#35e0a1;border-color:#1a6e55}.pill.on b{background:#35e0a1;box-shadow:0 0 6px #35e0a1}
          .name{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700;letter-spacing:2px;text-shadow:0 0 12px #000;text-transform:uppercase;text-align:center;padding:0 14px}
          .btns{display:flex;gap:10px;margin:12px 14px 0}
          .btns button{flex:1;height:46px;border:0;border-radius:12px;background:#264f7d;color:#0f2540;font:inherit;font-size:11px;letter-spacing:3px;display:flex;align-items:center;justify-content:center;gap:8px}
          .btns button:active{filter:brightness(1.25)}
          .dot{width:8px;height:8px;border-radius:50%;background:#0f2540;display:inline-block}
          .live .dot{background:#35e0a1}
          .con{margin:12px 14px 0;height:128px;border:1px solid #10233a;border-radius:10px;background:#02050a;display:flex;flex-direction:column;overflow:hidden}
          .ch{display:flex;justify-content:space-between;padding:11px 16px;border-bottom:1px solid #10233a;font-size:10px;letter-spacing:2px;color:#1f4a78}
          #log{flex:1;overflow-y:auto;padding:10px 16px;font-size:12px;letter-spacing:1px;color:#2b5f94;line-height:1.7}
          .pw{position:absolute;left:0;top:378px;width:360px;text-align:center;font-size:13px;letter-spacing:1px;color:#8793a0}
          .pw span{color:#2f7bd6}
          </style></head><body>
          <div id="wrap">
            <div class="panel">
              <div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
              <div class="hd">
                <div class="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
                <div class="ttl" id="title">TrapGoat</div>
                <button class="x" onclick="Android.collapse()">&#x2715;</button>
              </div>
              <div class="banner" id="banner">
                <div class="pill" id="pill"><b></b><span id="pt">OFFLINE</span></div>
                <div class="name" id="bname"></div>
              </div>
              <div class="btns">
                <button id="bStop">STOP EA</button>
                <button id="bScript">SCRIPT</button>
                <button id="bLive" class="live"><span class="dot"></span>LIVE</button>
              </div>
              <div class="con"><div class="ch"><span>EA CONSOLE</span><span>SCRIPT</span></div><div id="log"></div></div>
            </div>
            <div class="pw">Powered by <span>TradeExpert</span></div>
          </div>
          <script>
          var S={},cur=null;
          function $(i){return document.getElementById(i)}
          function send(a){ if(window.Android&&cur!==null) Android.action(cur,a); }
          function fit(){ $('wrap').style.transform='scale('+(window.innerWidth/360)+')'; }
          addEventListener('resize',fit); fit();
          function render(){
            var s=S[cur]; if(!s) return;
            $('bname').textContent=s.name||'EA'; $('bname').style.fontSize=((s.name||'').length>16?16:22)+'px';
            $('banner').style.backgroundImage=s.img?"linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),url('"+s.img.replace(/'/g,'%27')+"')":"linear-gradient(135deg,#0a1a2e,#05090e)";
            $('pill').className='pill'+(s.on?' on':''); $('pt').textContent=s.on?'ONLINE':'OFFLINE';
            $('bStop').textContent=s.on?'STOP EA':'START EA';
            var l=$('log'); l.innerHTML='';
            s.logs.forEach(function(t){ var d=document.createElement('div'); d.textContent='> '+t; l.appendChild(d); });
            l.scrollTop=l.scrollHeight;
          }
          function sysLine(on){ return '[SYS] ENGINE '+(on?'STARTED :: SCANNING':'STOPPED :: STANDBY'); }
          var cotex={
            open:function(id,name,img,online,title){
              var s=S[id]||(S[id]={logs:[]}); var changed=(s.on!==!!online);
              s.name=name; s.img=img; s.on=!!online; cur=id;
              if(!s.logs.length||changed) s.logs.push(sysLine(s.on));
              if(title) $('title').textContent=title; render(); },
            setStatus:function(id,o){ var s=S[id]; if(!s) return; if(s.on!==!!o){ s.on=!!o; s.logs.push(sysLine(s.on)); } if(id===cur) render(); },
            log:function(id,t){ var s=S[id]; if(!s) return; s.logs.push(t); if(s.logs.length>200) s.logs.shift(); if(id===cur) render(); },
            remove:function(id){ delete S[id]; if(cur===id) cur=null; }
          };
          $('bStop').onclick=function(){ var s=S[cur]; if(!s) return; cotex.setStatus(cur,!s.on); send(s.on?'start':'stop'); };
          $('bScript').onclick=function(){ if(cur===null) return; cotex.log(cur,'[SYS] SCRIPT REQUESTED'); send('script'); };
          $('bLive').onclick=function(){ this.classList.toggle('live'); send('live'); };
          </script></body></html>
          EOF
          cat > android/app/src/main/res/drawable/bot_avatar.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <gradient android:angle="90" android:startColor="#05090E" android:endColor="#1E5AA8"/>
          </shape>
          EOF
          python3 - "$PKG" <<'PY'
          import sys
          pkg=sys.argv[1]; p='android/app/src/main/AndroidManifest.xml'; s=open(p).read()
          if 'OverlayService' not in s:
              perms='''    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          '''
              svc='''        <service android:name="%s.OverlayService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FOREGROUND_SERVICE_SUBTYPE" android:value="floating_overlay"/>
                  </service>
          ''' % pkg
              s=s.replace('<application',perms+'    <application',1)
              s=s.replace('</application>',svc+'    </application>',1)
              open(p,'w').write(s)
          PY
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">TRADE EXPERT EA</string>#; s#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">TRADE EXPERT EA</string>#' android/app/src/main/res/values/strings.xml
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TRADE-EXPERT-EA-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
